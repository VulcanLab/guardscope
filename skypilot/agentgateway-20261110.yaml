# guardscope agentgateway campaign host (2026-11-10).
# Purpose: re-verify the agentgateway binding (plugins/agentgateway, the
# CNCF agentgateway control, phase 2a/2b uncommitted binding + integration
# changes) at design T1 under the full sensor-backed scope:
# examples/t1-mock-agentgateway.yaml and examples/t1-pi-agentgateway.yaml,
# warmup + acceptance pairs each, plus the formal L2 correlation fidelity
# check (framework/fidelity.py) against the acceptance topology.
# Stock Ubuntu 24.04 arm64 (the sensor ran the stock kernel 7.0.x-aws in the
# m1/m2 campaigns; only the t7 actplane engine needs the 6.17.x pin, and t1
# has no kernel-slot control). The host is provisioned interactively after
# launch: skypilot/provision-agentgateway-host.sh (docker + compose v2 +
# python3-venv + docker log bounds), then the repo rsync and
# skypilot/run-agentgateway.sh.
name: guardscope-agentgateway-20261110
resources:
  cloud: aws
  region: ap-northeast-1
  instance_type: m7g.2xlarge
  # ubuntu/images/hvm-ssd-gp3/ubuntu-noble-24.04-arm64-server-20261108
  # (canonical arm64 noble AMI, current build at campaign time; the
  # amd64 sibling ami-09123d7cb03420818 was the t7recheck host image)
  image_id: ami-02c0e6ea8b4afae39
  use_spot: true
run: |
  echo "agentgateway campaign host ready (spot m7g.2xlarge)"
