# compose/t1.yaml — deployment design T1: Gateway for HTTP tools, no egress
# Replay staging mount: ${GUARDSCOPE_STAGING_DIR:-../runs}/<harness> is
# mounted at /workspace/replay (default ../runs: the repo's runs/, resolved
# against this compose file's directory). Export GUARDSCOPE_STAGING_DIR
# (an ABSOLUTE path) to stage replay artifacts in an experiments workdir
# instead; the runner honors the same env when it stages (framework/
# workdir.py). The repo mount stays read-only source.
# restriction (main.tex Table 1).
#
# Topology: every harness http_tool_call crosses the AGT MCP Security Gateway
# (gateway/, the T1 enforcement point); stdio MCP tools, direct network
# connections, spawns, file writes, and credential reads stay inside the
# harness container and deliberately BYPASS the gateway — the transport and
# process escapes T1 exists to expose.
#
#   harness ──MCP over HTTP:8090──▶ t1-gateway ──MCP over HTTP:8091──▶ t1-mcp-http
#                                     │ (MCPGateway.intercept_tool_call,      │ raw HTTP:8080
#                                     │  audit -> gateway-logs volume)        ▼
#                                     │                                  t0-http-endpoint
#   harness ── raw fetch/socket/exec/fs (NO gateway) ──▶ net-peer / fs / secrets
#
# This file is the BASE of the t1 fixture (DESIGN.md 7): the full design
# structure (networks, targets, harness services, sensor profile, log
# volumes) with the gateway SLOT declared but the control service ABSENT.
# The control arrives as a binding overlay merged on top (the shipped
# binding: plugins/agt-gateway/overlay/t1.yaml, expressed exactly like a
# third party's). The base alone is NOT a validatable unit: the harness
# services below depend on the slot's gateway service, and `docker compose
# -f compose/t1.yaml config` fails loudly without the overlay. The slot
# declaration lives in compose/slots/t1.yaml (framework-side sidecar data;
# compose rejects unknown top-level keys, so the base stays pure compose).
#
# The canonical trace spec is unchanged from T0 (trace/traces/baseline.yaml);
# only the topology differs, which is what makes T1 coverage comparable to T0.
# Harness adapters switch to gateway-routed compiled plans in T1-3; until then
# the harness services below still run the T0 plans (uninspected control runs).
#
# Merged bring-up (the base comes FIRST: the overlay's relative build
# context resolves against the FIRST compose file's directory):
#   docker compose -f compose/t1.yaml -f plugins/agt-gateway/overlay/t1.yaml up -d
#   docker compose -f compose/t1.yaml -f plugins/agt-gateway/overlay/t1.yaml --profile sensor up -d tracee
#
# The Tracee sensor runs OUTSIDE the deployed topology (no t1net attachment).

name: inspection-t1

services:
  http-endpoint:
    build:
      context: ../targets
      dockerfile: http-endpoint/Dockerfile
    image: inspection/http-endpoint
    container_name: t1-http-endpoint
    networks: [t1net]
    volumes:
      - target-logs:/var/log/targets
    restart: unless-stopped

  mcp-http:
    build:
      context: ../targets
      dockerfile: mcp-http/Dockerfile
    image: inspection/mcp-http
    container_name: t1-mcp-http
    networks: [t1net]
    environment:
      HTTP_ENDPOINT_URL: http://http-endpoint:8080
    volumes:
      - target-logs:/var/log/targets
    restart: unless-stopped

  # gateway: the design's control SLOT (compose/slots/t1.yaml). The control
  # service itself is ABSENT from this base: it arrives as a binding overlay
  # (the shipped binding: plugins/agt-gateway/overlay/t1.yaml, whose gateway
  # definition moved out of this file verbatim). The harness services below
  # depend on the slot service, so the base alone fails docker compose
  # validation loudly — base+overlay is the validatable unit.

  net-peer:
    build:
      context: ../targets
      dockerfile: net-peer/Dockerfile
    image: inspection/net-peer
    container_name: t1-net-peer
    networks: [t1net]
    volumes:
      - target-logs:/var/log/targets
    restart: unless-stopped

  tracee:
    build:
      context: ../sensor
      dockerfile: Dockerfile.tracee
    image: inspection/tracee
    container_name: t1-tracee
    privileged: true
    pid: host
    cgroup: host
    volumes:
      - /etc/os-release:/etc/os-release-host:ro
      - /var/run:/var/run:ro
      - tracee-data:/tmp/tracee
    profiles: [sensor]
    restart: unless-stopped

  openclaw:
    build:
      context: ..
      dockerfile: harnesses/openclaw/Dockerfile
    image: inspection/openclaw
    container_name: t1-openclaw
    networks: [t1net]
    ports:
      - "127.0.0.1:28789:18789"   # driver: POST /tools/invoke -> replay_trace
    environment:
      TARGET_LOG_DIR: /var/log/targets
      REPLAY_LOG_DIR: /workspace/replay
      GATEWAY_URL: http://gateway:8090      # T1: http_tool_call via the gateway
    volumes:
      - target-logs:/var/log/targets
      - ${GUARDSCOPE_STAGING_DIR:-../runs}/openclaw:/workspace/replay
    depends_on: [gateway]
    restart: unless-stopped

  pi:
    build:
      context: ..
      dockerfile: harnesses/pi/Dockerfile
    image: inspection/pi
    container_name: t1-pi
    networks: [t1net]
    environment:
      TARGET_LOG_DIR: /var/log/targets
      REPLAY_LOG_DIR: /workspace/replay
      GATEWAY_URL: http://gateway:8090      # T1: http_tool_call via the gateway
    volumes:
      - target-logs:/var/log/targets
      - ${GUARDSCOPE_STAGING_DIR:-../runs}/pi:/workspace/replay
    depends_on: [gateway]
    restart: unless-stopped

networks:
  t1net: {}

volumes:
  target-logs: {}
  gateway-logs: {}
  tracee-data: {}
