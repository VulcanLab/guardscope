# compose/slots/t3.yaml — framework-side slot descriptor for design T3
# (DESIGN.md 7). Sidecar data, NOT a compose file (see compose/slots/t1.yaml
# for the mechanism). T3 routes both tool classes behind the gateway slot
# (the fs tool server proxied via UPSTREAM_FS_URL; the harness's stdio
# transport eliminated via GATEWAY_FS), and deploys the T3 policy.
#
# The mock-harness fixture (compose/t3-mock.yaml) realizes the same slot;
# its binding overlay is plugins/<control>/overlay/t3-mock.yaml.
schema: 1
design: t3
slot: gateway
kind: container
service: gateway
network: t3net
harness_env:
  GATEWAY_URL: http://gateway:8090
log_volume: gateway-logs
policy: gateway/policy-t3.yaml
