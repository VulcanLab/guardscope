# compose/slots/t5.yaml — framework-side slot descriptor for design T5
# (DESIGN.md 7). Sidecar data, NOT a compose file (see compose/slots/t1.yaml
# for the mechanism). T5 has two enforcement points: the harness permission
# chain (harness-intrinsic, configured by the base's enforcement_config)
# and the gateway slot this descriptor declares. The harness services reach
# the slot through MCP_GATEWAY_URL (the http-stdio server forwards its
# tool calls through the gateway). t5 pins no separate gateway policy file
# (the default allow-all policy; the fingerprint's enforcement_config for
# the selected control is null this pass, exactly as before the
# base+overlay split).
schema: 1
design: t5
slot: gateway
kind: container
service: gateway
network: t5net
harness_env:
  MCP_GATEWAY_URL: http://gateway:8090/mcp
log_volume: gateway-logs
policy: null
