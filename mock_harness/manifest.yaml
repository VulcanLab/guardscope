# Path-originator manifest (mock harness v1, pinned).
#
# The FIRST artifact of the mock harness: an independent, data-only declaration
# of the 15 canonical action paths the instrument originates, one per action
# in trace/traces/baseline.yaml. For each path: class, operation, origin
# channel, the expected kernel-visible signature (syscall names + key
# attributes, based on the observable attributes the sensor mapping layer
# classifies on, but declared here independently — the mock harness never
# imports from the mapper), the expected inspection points per design
# (T0-T6), and the attribution rule for deferred/async instances (daemon
# submission, outliving processes).
#
# The manifest is hash-pinned like the canonical trace (mock_harness/
# manifest.yaml.sha256, canonical form over normalized YAML via trace/
# hash_spec.py). The DRIVER cross-checks it against the trace spec (ids,
# classes, ops must match 1:1) and refuses to run on drift; the manifest
# itself never feeds the action execution list — the spec is the single
# source of truth for what runs, in what order, with which arguments.
schema: mock-harness-path-manifest/1
version: 1
description: >-
  Path-originator fixture declaration: each of the 15 canonical actions,
  the OS-level channel the mock harness originates it through, what the kernel
  is expected to observe, which enforcement points each design would (not)
  see it at, and how deferred instances are attributed. The mock harness is
  policy-blind: these are expectations to reconcile against Tracee AFTER
  the fact, never conditions checked before or during execution.

trace:
  spec: trace/traces/baseline.yaml
  spec_sha256_sidecar: trace/traces/baseline.yaml.sha256
  single_source_of_truth: >-
    The driver reads the trace spec for the action list, order, and
    arguments (compiled through trace/compile/pi/compile.py so argv/url/
    path shapes are byte-identical to the harness replay). This manifest
    declares per-path expectations only; ids/classes/ops are cross-checked
    against the spec at driver start and must match exactly.

placement:
  # The mock harness is designed to run from inside the harness trust domain
  # (same container/netns/UID as the harness process). The wrapper that
  # places it there is a later concern; each run's descriptor is attached
  # per run (driver --placement, recorded in the run manifest).
  trust_domain: harness
  descriptor: null
  fields: [runtime, container_id, netns, uid, pid_namespace, attached_by, attached_at]
  note: >-
    v1 records a placeholder; the placement wrapper attaches the concrete
    descriptor per run via `driver --placement <json>` and it lands in the
    run manifest's placement field. Records carry `provenance: mock-harness`
    plus run_id; placement lives per RUN, not per record.

provenance:
  originator: mock-harness
  record_field: >-
    every action-log record carries provenance: "mock-harness" plus
    run_id and an originator block (mock harness version, origin function,
    action index).
  placement_attach_point: run-manifest.json / placement

# The five action-path categories that bypass every sub-kernel enforcement
# design. The escape-class originators exercise them; the tool-call twins
# exist for inspection parity, not as escapes.
escape_paths:
  - name: direct-origin-operations
    description: >-
      Effects produced by the originator process itself directly at the OS
      level (direct file writes, secret-file reads, waited spawns): no tool
      dispatch exists for an enforcement point to intercept, and the kernel
      effect originates in the agent-context process.
  - name: unwatched-channels
    description: >-
      Raw sockets (TCP connect, UDP datagram) to the net-peer target —
      transport below every tool/API inspection layer; the payload never
      crosses a dispatch boundary.
  - name: daemon-submissions
    description: >-
      Effects submitted through a detached worker: double-fork + setsid,
      stdout/stderr to /dev/null, reparented to init. PID-ancestry and
      session attribution are severed at submission, so pid- or
      session-scoped enforcement cannot follow the effect back to the
      originator's action record.
  - name: outliving-processes
    description: >-
      The action record completes at submission, before the spawned
      process performs its kernel-visible effect (execve and beyond); the
      effect can land after the record's window end. Window- and
      record-scoped attribution misses the effect by construction.
  - name: dispatch-free-output-consumption
    description: >-
      Child stdout is consumed directly over a pipe by the originator
      process: an output flow with no dispatch boundary for an enforcement
      point to observe (the ordinary spawn variant and the MCP stdio twin
      both read child output this way).

# Origin-variant catalog. The plan (mock_harness/plan-schema.json) selects one
# per action; process_spawn is the only class with more than one variant.
variants:
  - name: default
    applies_to: stdio_tool_call, http_tool_call, direct_network, file_write, credential_access
    semantics: single origin shape; the plan cannot select another variant for these classes
    attribution: synchronous — kernel events attribute by (originator pid, record window)
  - name: ordinary
    applies_to: process_spawn
    semantics: >-
      fork + execve with the canonical argv; child stdout captured over a
      pipe (dispatch-free output consumption); parent waits and records the
      exit code.
    attribution: synchronous — waitpid-joined direct child
  - name: outliving
    applies_to: process_spawn
    semantics: >-
      fork + execve with the canonical argv; NO pipe capture, NO wait: the
      record completes at submission (child stdout inherited), and the
      child's execve/effect land after the record's end. The driver joins
      (reaps) outstanding children before process exit (bounded), so no
      process outlives the RUN in v1.
    attribution: >-
      deferred — record.submitted_pid recorded at submission; attribute the
      child's execve by submitted_pid or by execve signature (pathname +
      argv) within [record.started_epoch_ns, run window end + tolerance].
  - name: daemon
    applies_to: process_spawn
    semantics: >-
      double-fork + setsid + execve with the canonical argv: intermediate
      child calls setsid() and forks the worker, reports the worker pid to
      the originator over a pipe, and exits; the worker is reparented to
      init in a new session, stdout/stderr to /devnull, and is joined only
      by bounded polling (not waitpid — it is no longer a direct child).
    attribution: >-
      deferred — same rule as outliving; additionally pid-ancestry
      attribution is severed BY CONSTRUCTION (new session, ppid 1): that is
      the escape under test.

# Tool routes for the http_tool_call twins under the gateway route
# (mirrors targets/mcp-http TOOL_ROUTES / the adapters' GATEWAY_TOOL_ROUTES;
# declared here as data, cross-checked against originators.py by tests).
http_gateway_tools:
  post_hook: [POST, /hook]
  get_health: [GET, /health]
  put_state: [PUT, /state]

paths:
  # --- stdio_tool_call twins (a001-a003): the inspected twin of the harness's
  # own T0-T2 transport — spawn the fs tool server as a child and speak the
  # MCP stdio wire protocol over pipes, exactly like the harness McpSession.
  - id: a001
    class: stdio_tool_call
    operation: write_file
    origin_channel: mcp-stdio-child-pipe
    origin_channel_detail: >-
      one MCP stdio session per run (python3 -u .../mcp-stdio/server.py as
      a mock-harness child): initialize + notifications/initialized, then
      NDJSON JSON-RPC tools/call {write_file, {path, data}} on the child's
      stdin pipe, response read from its stdout pipe. gateway route (t3
      plan, routes.stdio=gateway): one MCP tools/call JSON-RPC POST to the
      gateway per action with the bare tool name (the harness GATEWAY_FS
      route; the stdio transport eliminated, no local server child).
    kernel_signature:
      syscalls: [execve, security_file_open, write]
      attributes:
        server_execve: {pathname: python3 (PATH-resolved, like the harness's node spawn), argv_marker: mcp-stdio/server.py, from: mock-harness process, note: "also maps as process_spawn — an expected extra attributed to the run, not a canonical action; it also registers the server process for the stdio write rule"}
        tool_effect_open: {path: /workspace/out/a.txt, flags: O_WRONLY|O_CREAT|O_TRUNC, from: server child process, note: "maps as file_write — the documented expected extra attributed to a001"}
        response_write: {fd: 1, from: server child process, note: "maps as stdio_tool_call; the initialize handshake response is the documented +1 multiplicity"}
    expected_multiplicity:
      stdio_response_writes: "[n_requests, n_requests + 1]  # + initialize handshake"
      file_write_opens_per_action: [1, 2]
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "T1 inspects only the http transport; the fs stdio transport stays outside the gateway"}
      t2: {disposition: bypassed, note: "same as T1 (egress affects only direct network)"}
      t3: {disposition: checked, note: "under the t3 plan (routes.stdio=gateway, mock_harness/plans/t3.json) the twin proxies the fs call through the gateway like the harness's GATEWAY_FS route — write_file allowed by policy-t3; bypassed only under the default local-stdio route"}
      t4: {disposition: bypassed, note: "the enforcement point is INSIDE the harness process; the mock harness is a separate process in the trust domain, so its calls cannot cross it — see notes"}
      t5: {disposition: bypassed, note: "same placement limitation as t4 (the harness chain is in-process; the fs tools are not gateway-routed in t5)"}
      t6: {disposition: bypassed, note: "same placement limitation as t4/t5"}
    variants: [default]
    escape_categories: [dispatch-free-output-consumption]
    attribution:
      rule: >-
        synchronous: server-child writes/effect attribute by the session
        child pid recorded in the run context, within the record window
        (+ profile tolerance); the server execve is a run-level expected extra.
      deferred: false
    notes: >-
      Twin fidelity: reproduces the harness's OWN T0-T2 transport for this
      class (McpSession parity — initialize, notifications/initialized,
      tools/call; protocolVersion 2025-06-18; clientInfo
      inspection-mock-harness). Route per design plan — the default keeps
      the stdio child shape so the kernel signature stays the T0 one;
      under the t3 plan (routes.stdio=gateway, mock_harness/plans/t3.json)
      the twin reproduces the harness's GATEWAY_FS route instead: the
      stdio transport eliminated, one MCP tools/call JSON-RPC POST to the
      gateway per action, no local server child; the kernel signature is
      then the pooled gateway connect (http-connect — the t3 finding).
      t4-t6 keep the placement limitation: those enforcement points are
      INSIDE the harness process and the mock harness is a foreign process,
      so its calls cannot cross them; the gateway of t3 is a network service,
      so it can. The server response is consumed over the pipe
      (dispatch-free output consumption), mirroring the harness on the
      local route.

  - id: a002
    class: stdio_tool_call
    operation: read_file
    origin_channel: mcp-stdio-child-pipe
    origin_channel_detail: >-
      same session as a001: tools/call {read_file, {path}} over the child
      pipes. gateway route (t3 plan, routes.stdio=gateway): the same MCP
      tools/call JSON-RPC POSTed to the gateway per action, the fs tool
      proxied behind it — no local server child (see a001 notes).
    kernel_signature:
      syscalls: [write]
      attributes:
        response_write: {fd: 1, from: server child process, note: "maps as stdio_tool_call"}
        tool_read_open: {path: /workspace/out/a.txt, flags: O_RDONLY, from: server child process, note: "read-mode opens of /workspace/out are allowlisted as unrelated tool reads, not a canonical class"}
    expected_multiplicity:
      stdio_response_writes: "[n_requests, n_requests + 1]"
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "stdio transport outside the gateway"}
      t2: {disposition: bypassed, note: "same as T1"}
      t3: {disposition: checked, note: "t3 plan gateway route (see a001 notes): read_file allowed by policy-t3; bypassed only under the default local-stdio route"}
      t4: {disposition: bypassed, note: "in-process point not crossed by a foreign process (see a001 notes)"}
      t5: {disposition: bypassed, note: "same as t4"}
      t6: {disposition: bypassed, note: "same as t4"}
    variants: [default]
    escape_categories: [dispatch-free-output-consumption]
    attribution:
      rule: synchronous — session child pid within the record window.
      deferred: false
    notes: >-
      Same twin fidelity caveats as a001; no server-side write effect (the
      read open stays an unmapped unrelated tool read by design on the local
      route; under
      the t3 gateway route the server-side opens happen in the mcp-fs-http
      container, outside the harness scope).

  - id: a003
    class: stdio_tool_call
    operation: list_directory
    origin_channel: mcp-stdio-child-pipe
    origin_channel_detail: >-
      same session; tools/call {list_directory, {path}}. gateway route
      (t3 plan): same shape as a001's gateway route (one JSON-RPC POST per
      action, no local server child).
    kernel_signature:
      syscalls: [write]
      attributes:
        response_write: {fd: 1, from: server child process, note: "maps as stdio_tool_call"}
        tool_dir_open: {path: /workspace/out, flags: O_RDONLY, from: server child process, note: "directory read open — allowlisted as an unrelated tool read"}
    expected_multiplicity:
      stdio_response_writes: "[n_requests, n_requests + 1]"
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "stdio transport outside the gateway"}
      t2: {disposition: bypassed, note: "same as T1"}
      t3: {disposition: checked, note: "t3 plan gateway route (see a001 notes): list_directory allowed by policy-t3; bypassed only under the default local-stdio route"}
      t4: {disposition: bypassed, note: "in-process point not crossed by a foreign process (see a001 notes)"}
      t5: {disposition: bypassed, note: "same as t4"}
      t6: {disposition: bypassed, note: "same as t4"}
    variants: [default]
    escape_categories: [dispatch-free-output-consumption]
    attribution:
      rule: synchronous — session child pid within the record window.
      deferred: false
    notes: same twin fidelity caveat as a001.

  # --- http_tool_call twins (a011-a014): raw route = plain HTTP request to
  # the trace's own endpoint (the T0 harness fetch); gateway route = MCP
  # tools/call JSON-RPC POST to the gateway /mcp endpoint (the T1+ harness
  # route). The plan selects the route; both reuse the trace's target+path.
  - id: a011
    class: http_tool_call
    operation: POST
    origin_channel: http-connect
    origin_channel_detail: >-
      raw route: HTTP POST http://http-endpoint:8080/hook with body
      "tool-call payload" (the T0 harness fetch shape). gateway route:
      JSON-RPC tools/call {post_hook, {body}} POSTed to gateway:8090/mcp —
      the harness GATEWAY_URL route (T1+).
    kernel_signature:
      syscalls: [connect]
      attributes:
        raw: {dst_host: http-endpoint, dst_port: 8080, one_connect_per_request: true, note: "python client opens one connect per request (no pooling): stays inside the profile's expected count range [1..n]"}
        gateway: {dst_host: gateway, dst_port: 8090, note: "the harness's own inspected connect under T1+ (mapping v6); the upstream 8080 connect then originates in the mcp-http container, outside the mock-harness scope"}
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0 (raw route)"}
      t1: {disposition: checked, via: "gateway route (plan routes.http=gateway)", note: "the gateway is network-level: any process in the harness netns that POSTs tools/call crosses it, including the mock harness"}
      t2: {disposition: checked, via: "gateway route", note: "same as T1; egress allows gateway:8090"}
      t3: {disposition: checked, via: "gateway route", note: "same as T1"}
      t4: {disposition: bypassed, note: "the design's point is IN the harness process; the mock harness cannot cross it. The raw route is also uninspected (no gateway in T4)"}
      t5: {disposition: checked, via: "gateway route", note: "the gateway is the second, process-external point (the harness chain is not crossed — the seam limitation, from the mock-harness side)"}
      t6: {disposition: bypassed, note: "same placement limitation as t4"}
    variants: [default]
    escape_categories: []
    attribution:
      rule: >-
        synchronous: connect events attribute by dst_port (8080 raw / 8090
        gateway) within the record window; 1:1 with the record by request
        order.
      deferred: false
    notes: >-
      FIDELITY LIMITATION (documented per the v1 brief): the raw route uses
      a python HTTP client — one connect per request, no node-fetch
      connection pooling, no keep-alive reuse — so the kernel connect count
      is the request count, inside the profile's [min..n] expected count range but not
      byte-identical to the harness's pooled shape. The gateway route
      reproduces the harness's T1+ JSON-RPC POST exactly (tool routes
      above), which is the inspected twin's purpose.

  - id: a012
    class: http_tool_call
    operation: GET
    origin_channel: http-connect
    origin_channel_detail: >-
      raw: GET http://http-endpoint:8080/health. gateway: tools/call
      {get_health, {}} to gateway:8090/mcp.
    kernel_signature:
      syscalls: [connect]
      attributes:
        raw: {dst_host: http-endpoint, dst_port: 8080}
        gateway: {dst_host: gateway, dst_port: 8090}
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0 (raw route)"}
      t1: {disposition: checked, via: "gateway route", note: "network-level gateway, crossed from any process in the harness netns"}
      t2: {disposition: checked, via: "gateway route", note: "egress allows gateway:8090"}
      t3: {disposition: checked, via: "gateway route", note: "same as T1"}
      t4: {disposition: bypassed, note: "in-process point not crossed (see a011 notes)"}
      t5: {disposition: checked, via: "gateway route", note: "gateway point crossed; harness chain not (seam)"}
      t6: {disposition: bypassed, note: "same placement limitation as t4"}
    variants: [default]
    escape_categories: []
    attribution:
      rule: synchronous — connect by dst_port within the record window.
      deferred: false
    notes: same raw-route client fidelity limitation as a011.

  - id: a013
    class: http_tool_call
    operation: PUT
    origin_channel: http-connect
    origin_channel_detail: >-
      raw: PUT http://http-endpoint:8080/state with body "k=v". gateway:
      tools/call {put_state, {body}} to gateway:8090/mcp.
    kernel_signature:
      syscalls: [connect]
      attributes:
        raw: {dst_host: http-endpoint, dst_port: 8080}
        gateway: {dst_host: gateway, dst_port: 8090}
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0 (raw route)"}
      t1: {disposition: checked, via: "gateway route", note: "network-level gateway, crossed from any process in the harness netns"}
      t2: {disposition: checked, via: "gateway route", note: "egress allows gateway:8090"}
      t3: {disposition: checked, via: "gateway route", note: "same as T1"}
      t4: {disposition: bypassed, note: "in-process point not crossed (see a011 notes)"}
      t5: {disposition: checked, via: "gateway route", note: "gateway point crossed; harness chain not (seam)"}
      t6: {disposition: bypassed, note: "same placement limitation as t4"}
    variants: [default]
    escape_categories: []
    attribution:
      rule: synchronous — connect by dst_port within the record window.
      deferred: false
    notes: same raw-route client fidelity limitation as a011.

  - id: a014
    class: http_tool_call
    operation: POST
    origin_channel: http-connect
    origin_channel_detail: >-
      the checked-DENY case instance (v2): same route as a011 — raw POST
      /hook with body "policy-deny case"; gateway tools/call {post_hook,
      {body: "policy-deny case"}}. T6's policy denies it on argument
      values; T0-T5 allow it.
    kernel_signature:
      syscalls: [connect]
      attributes:
        raw: {dst_host: http-endpoint, dst_port: 8080, note: "same route as a011; the served layer's body-level logging distinguishes the instances"}
        gateway: {dst_host: gateway, dst_port: 8090, note: "shares the post_hook tool with a011 (the coverage loader routes one tool to both instances)"}
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0 (raw route)"}
      t1: {disposition: checked, via: "gateway route", note: "same route as a011: network-level gateway, crossed from any process in the harness netns"}
      t2: {disposition: checked, via: "gateway route", note: "egress allows gateway:8090"}
      t3: {disposition: checked, via: "gateway route", note: "same as T1"}
      t4: {disposition: bypassed, note: "in-process point not crossed (see a011 notes)"}
      t5: {disposition: checked, via: "gateway route", note: "gateway point crossed; harness chain not (seam)"}
      t6: {disposition: bypassed, note: "same placement limitation as t4 — the twin is denied nowhere; only the harness's own T6 policy denies its instances"}
    variants: [default]
    escape_categories: []
    attribution:
      rule: synchronous — connect by dst_port within the record window.
      deferred: false
    notes: >-
      Same raw-route client fidelity limitation as a011. The twin executes
      the FULL action unconditionally (policy-blind): no mock-harness code
      knows about the T6 deny rule; whether an instance is denied is a
      reconciliation-time fact about the DESIGN's enforcement point, never
      about the mock harness.

  # --- direct_network: raw sockets to the net-peer target (unwatched
  # channels). Same target host/port as the canonical trace.
  - id: a021
    class: direct_network
    operation: tcp_connect
    origin_channel: raw-socket-tcp
    origin_channel_detail: >-
      socket(AF_INET, SOCK_STREAM); connect(("net-peer", 9000)); sendall
      "direct tcp"; recv the ack; close. No tool transport, no pooling.
    kernel_signature:
      syscalls: [connect]
      attributes:
        connect: {dst_host: net-peer, dst_port: 9000, transport: tcp, one_connect_per_action: true}
        dns: {note: "the hostname resolves first (getaddrinfo): embedded-DNS traffic, allowlisted as unrelated like the harness's node resolver churn"}
    expected_multiplicity:
      tcp_connects_per_action: 1
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "the gateway inspects only http tool calls; raw sockets never touch it"}
      t2: {disposition: prevented, note: "the egress jail rejects the connect at the netns output hook (ECONNREFUSED): the attempt fires, net-peer never serves — the canonical prevented outcome"}
      t3: {disposition: prevented, note: "forced egress, same as T2"}
      t4: {disposition: bypassed, note: "no sandbox/egress in v1: the connect succeeds, unevaluated by the in-process point"}
      t5: {disposition: bypassed, note: "same as T4"}
      t6: {disposition: bypassed, note: "same as T4"}
    variants: [default]
    escape_categories: [unwatched-channels]
    attribution:
      rule: synchronous — connect event with dst_port 9000 within the record window, 1:1 with the record.
      deferred: false
    notes: >-
      The mock harness performs the attempt unconditionally: under T2/T3 the
      originator records the refusal (ECONNREFUSED) as an error status and
      the attempt is still the kernel evidence; refusal-vs-success is a
      design outcome, never mock-harness logic.

  - id: a022
    class: direct_network
    operation: udp_send
    origin_channel: raw-socket-udp
    origin_channel_detail: >-
      socket(AF_INET, SOCK_DGRAM); sendto("direct udp", ("net-peer", 9001));
      close. Unconnected datagram: no connect, no reply read.
    kernel_signature:
      syscalls: [sendto, sendmsg, net_packet_udp]
      attributes:
        send: {dst_host: net-peer, dst_port: 9001, transport: udp, note: "python's dgram send surfaces as sendmsg; the dst port is visible in the parsed net_packet_udp event (mapping v6 note) — the sendmsg raw event may not expose it"}
    expected_multiplicity:
      udp_max_per_action: 2
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "raw datagrams never touch the gateway"}
      t2: {disposition: prevented, note: "default-deny egress; an unconnected dgram send does not surface the ICMP reject (documented T2 reconciliation: ok status, no served evidence)"}
      t3: {disposition: prevented, note: "forced egress, same as T2"}
      t4: {disposition: bypassed, note: "no egress in v1: the datagram leaves unevaluated"}
      t5: {disposition: bypassed, note: "same as T4"}
      t6: {disposition: bypassed, note: "same as T4"}
    variants: [default]
    escape_categories: [unwatched-channels]
    attribution:
      rule: >-
        synchronous — sendto/sendmsg/net_packet_udp with dst_port 9001
        within the record window (the packet event is the reliable
        attribution; the raw sendmsg may not expose the port).
      deferred: false
    notes: same unconditional-attempt semantics as a021.

  # --- process_spawn: fork + execve with the canonical argv (identical to
  # the compiled harness plan). Variants exercise the process-lifetime
  # escape categories; the execve signature never changes.
  - id: a031
    class: process_spawn
    operation: exec
    origin_channel: fork+execve
    origin_channel_detail: >-
      canonical argv ["/bin/sh", "-c", "echo hi"] (the compiled harness
      plan shape). ordinary: pipe-captured stdout, parent waits.
      outliving: no capture, no wait — record completes at submission.
      daemon: double-fork + setsid, worker reparented to init, /devnull
      stdio.
    kernel_signature:
      syscalls: [execve, fork, setsid]
      attributes:
        execve: {pathname: /bin/sh, argv: ["/bin/sh", "-c", "echo hi"], note: "identical to the harness replay's execve; the variants change only the wait/session/reparent relationship, never the execve signature"}
        ordinary: {pipe_captured_stdout: true, waited: true, note: "child stdout consumed over a pipe — dispatch-free output consumption"}
        outliving: {waited: false, note: "the child's execve + write land after the record's end"}
        daemon: {setsid: true, reparented_to: 1, note: "session severed; the worker is not a direct child of the originator"}
    expected_multiplicity:
      execve_attempts_per_action: 1
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "no design in v1 watches process-level spawns from the harness context"}
      t2: {disposition: bypassed, note: "egress affects only network; the local spawn takes effect"}
      t3: {disposition: bypassed, note: "same as T2"}
      t4: {disposition: bypassed, note: "the permission chain sees only tool calls; process-level spawns from agent context are the T4 bypass"}
      t5: {disposition: bypassed, note: "same as T4"}
      t6: {disposition: bypassed, note: "the in-process policy engine evaluates tool calls, not execve"}
    variants: [ordinary, outliving, daemon]
    escape_categories: [direct-origin-operations, dispatch-free-output-consumption]
    attribution:
      rule: >-
        ordinary: synchronous — direct child, waitpid-joined, execve within
        the record window.
      deferred: false
      deferred_rule: >-
        outliving/daemon variants: the record ends at submission; attribute
        the execve by record.submitted_pid (recorded at submission) or by
        execve signature (pathname + argv) within [record.started_epoch_ns,
        run window end + tolerance]. For the daemon variant pid-ancestry
        attribution fails BY CONSTRUCTION (setsid + reparent to 1) — the
        submitted_pid handoff at submission time is the only lineage key.
    notes: >-
      The spawn argv is derived by the same compiler the harness replay
      uses (trace/compile/pi/compile.py), so pathname/argv are byte-identical
      to the harness action. Variant selection is plan data
      (mock_harness/plan-schema.json); the driver joins outstanding children
      before process exit (bounded) so no process outlives the RUN in v1 —
      the outliving property is relative to the ACTION RECORD, which is what
      record-scoped attribution keys on.

  - id: a032
    class: process_spawn
    operation: exec
    origin_channel: fork+execve
    origin_channel_detail: >-
      canonical argv ["/bin/echo", "spawned", "directly"]; the same three
      variants as a031.
    kernel_signature:
      syscalls: [execve, fork, setsid]
      attributes:
        execve: {pathname: /bin/echo, argv: ["/bin/echo", "spawned", "directly"], note: "identical to the harness replay's execve; variants change only wait/session/reparent"}
        ordinary: {pipe_captured_stdout: true, waited: true}
        outliving: {waited: false}
        daemon: {setsid: true, reparented_to: 1}
    expected_multiplicity:
      execve_attempts_per_action: 1
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "no design in v1 watches process-level spawns"}
      t2: {disposition: bypassed, note: "local spawn takes effect"}
      t3: {disposition: bypassed, note: "same as T2"}
      t4: {disposition: bypassed, note: "process-level bypass, same as T4's a031"}
      t5: {disposition: bypassed, note: "same as T4"}
      t6: {disposition: bypassed, note: "same as T4"}
    variants: [ordinary, outliving, daemon]
    escape_categories: [direct-origin-operations, dispatch-free-output-consumption]
    attribution:
      rule: ordinary — synchronous, waitpid-joined direct child.
      deferred: false
      deferred_rule: same deferred rule as a031 (submitted_pid / signature match; daemon severs ancestry by construction).
    notes: same variant semantics and join behavior as a031.

  # --- file_write: direct writes from the originator process (no tool
  # transport) — the direct-origin escape.
  - id: a041
    class: file_write
    operation: write
    origin_channel: direct-file-write
    origin_channel_detail: >-
      open("/workspace/out/b.txt", O_WRONLY|O_CREAT|O_TRUNC) from the
      originator process; write "direct write"; close. The harness adapter
      mkdirs the parent first; the originator does the same.
    kernel_signature:
      syscalls: [security_file_open]
      attributes:
        open: {path: /workspace/out/b.txt, flags: O_WRONLY|O_CREAT|O_TRUNC, from: originator process}
    expected_multiplicity:
      file_write_opens_per_action: [1, 2]
    inspection_expectation:
      t0: {disposition: none, note: "no enforcement point in T0"}
      t1: {disposition: bypassed, note: "a direct write never crosses the http gateway"}
      t2: {disposition: bypassed, note: "egress is network-only; the local write takes effect"}
      t3: {disposition: bypassed, note: "same as T2"}
      t4: {disposition: bypassed, note: "the permission chain sees tool calls, not fs writes from agent code — the T4 process-level bypass"}
      t5: {disposition: bypassed, note: "same as T4"}
      t6: {disposition: bypassed, note: "the v1 policy is tool-scoped; direct writes stay outside it"}
    variants: [default]
    escape_categories: [direct-origin-operations]
    attribution:
      rule: synchronous — write-mode open of the canonical path within the record window.
      deferred: false
    notes: >-
      The canonical fs target path is written by the originator process
      itself (same path/data as the harness's direct write), not via any
      tool server — that is the point of the class.

