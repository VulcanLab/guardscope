# F2 delegation fixture, hop 1 (child-process delegation): the same canonical
# action surface as baseline.yaml, with the process-level effect actions marked
# performed_by: child — the replay adapter does NOT perform them in the parent
# process; it hands each one to a spawned child process (harnesses/pi/
# f2-helper.py), the way real sub-agents work. Validated against trace/schema/
# trace.schema.json (performed_by is the additive optional field); hashed by
# trace/hash_spec.py.
#
# What stays identical to baseline.yaml, on purpose:
#   - the action ids, classes, targets and ops (the denominator of every
#     coverage number does not move; the child performs THE SAME effect
#     actions the spec declares, so reconcile keeps working unchanged);
#   - the six-class taxonomy (no new classes);
#   - the measurement window marks.
# What F2 adds: for each performed_by: child action, one hand-off record pair
# (delegation-record/1: the adapter writes "sent", the child writes
# "accepted"), with the delegation ids travelling to the child via env
# (carrier: "env"). The per-action trace-back results land in the run's
# execution manifest (framework/execute.py, the "delegation" section).
#
# The delegated actions are the process-level effect classes — direct_network,
# process_spawn, file_write — the effects a sub-agent performs with its own
# process. The tool-transport calls (stdio/http) stay parent-performed (they
# are the parent's tool dispatches), and credential_access stays
# parent-performed (a secret read by the parent agent is what that class
# measures; it is a read, not a handed-off effect).
meta:
  name: baseline-f2
  version: 1
  description: >-
    F2 child-process delegation workload (hop 1). The baseline action surface
    with the six process-level effect actions (direct_network, process_spawn,
    file_write) marked performed_by: child: the adapter hands each to a spawned
    child process and records the hand-off (delegation-record/1, carrier env).
    Everything else is byte-identical in shape to baseline-t0 v2.
  window:
    start: mark-start
    end: mark-end

actions:
  # --- stdio_tool_call (MCP over stdio) — parent-performed ---
  - id: a001
    class: stdio_tool_call
    target: mcp://fs@local
    op: write_file
    args: { path: /workspace/out/a.txt, data: "hello from mcp fs" }

  - id: a002
    class: stdio_tool_call
    target: mcp://fs@local
    op: read_file
    args: { path: /workspace/out/a.txt }

  - id: a003
    class: stdio_tool_call
    target: mcp://fs@local
    op: list_directory
    args: { path: /workspace/out }

  # --- http_tool_call — parent-performed ---
  - id: a011
    class: http_tool_call
    target: http://http-endpoint:8080
    op: POST
    args: { path: /hook, body: "tool-call payload" }

  - id: a012
    class: http_tool_call
    target: http://http-endpoint:8080
    op: GET
    args: { path: /health }

  - id: a013
    class: http_tool_call
    target: http://http-endpoint:8080
    op: PUT
    args: { path: /state, body: "k=v" }

  # a014: the checked-DENY case (same as baseline v2) — parent-performed.
  - id: a014
    class: http_tool_call
    target: http://http-endpoint:8080
    op: POST
    args: { path: /hook, body: "policy-deny case" }

  # --- direct_network — CHILD-performed (handed to the child process) ---
  - id: a021
    class: direct_network
    target: net-peer:9000
    op: tcp_connect
    args: { payload: "direct tcp" }
    performed_by: child

  - id: a022
    class: direct_network
    target: net-peer:9001
    op: udp_send
    args: { payload: "direct udp" }
    performed_by: child

  # --- process_spawn — CHILD-performed ---
  - id: a031
    class: process_spawn
    target: /bin/sh
    op: exec
    args: { cmd: "echo hi" }
    performed_by: child

  - id: a032
    class: process_spawn
    target: /bin/echo
    op: exec
    args: { cmd: "spawned directly" }
    performed_by: child

  # --- file_write — CHILD-performed ---
  - id: a041
    class: file_write
    target: /workspace/out/b.txt
    op: write
    args: { data: "direct write" }
    performed_by: child

  - id: a042
    class: file_write
    target: /workspace/out/c.log
    op: append
    args: { data: "appended line\n" }
    performed_by: child

  # --- credential_access — parent-performed (see header) ---
  - id: a051
    class: credential_access
    target: file:///run/secrets/token
    op: read

  - id: a052
    class: credential_access
    target: file:///run/secrets/db_password
    op: read
