# F9 delegation fixture (work that outlives its parent): the same
# canonical action surface as baseline.yaml, with the process-level
# effect actions marked performed_by: detached-child. The replay adapter
# spawns the child (harnesses/pi/f2-helper.py, the same program as F2)
# DETACHED and DOES NOT WAIT: it writes the "sent" hand-off record, marks
# the action's replay row with the new terminal status "submitted" (the
# effect happens later), and the replay ends — the parent process is gone
# before the child finishes. The child performs the effects AFTER the
# parent is gone and writes its own records: the "accepted" line, its
# liveness marker, and a report file (f9-report-<delegation id>.json on
# the replay volume) the runner collects after the window. Validated
# against trace/schema/trace.schema.json (performed_by is the additive
# optional field); hashed by trace/hash_spec.py.
#
# THE MEASUREMENT: do the controls still see the effects after the parent
# died? The delegation records already survive on the replay volume (the
# collection is runner-side, not process-side — the volume is what
# outlives the parent), and the kernel watcher keeps seeing the child's
# effects; a harness-mediated control whose view ends with the parent
# process loses everything. The manifest's delegation section answers the
# trace-back question through the child's echo like any other fixture;
# the effect question is answered by the post-window report the runner
# collects.
#
# What stays identical to baseline.yaml, on purpose:
#   - the action ids, classes, targets and ops (the denominator of every
#     coverage number does not move; the detached child performs THE SAME
#     effect actions the spec declares, so reconcile keeps working
#     unchanged);
#   - the six-class taxonomy (no new classes);
#   - the measurement window marks.
# The hand-off records are exactly the F2 shape (delegation-record/1:
# channel "child", protocol "stdio", carrier "env" — the adapter writes
# "sent", the child writes "accepted"), with one difference in timing:
# the acceptance and the effects land after the replay ended.
#
# The delegated actions are the process-level effect classes — direct_network,
# process_spawn, file_write — the effects a background child performs with
# its own process after the parent is gone. The tool-transport calls
# (stdio/http) and credential_access stay parent-performed (see
# baseline-f2.yaml's header).
meta:
  name: baseline-f9
  version: 1
  description: >-
    F9 outlives-its-parent delegation workload. The baseline action surface
    with the six process-level effect actions (direct_network, process_spawn,
    file_write) marked performed_by: detached-child: the adapter spawns the
    child detached, writes the sent hand-off record, does not wait, marks the
    replay row submitted and ends the replay — the child performs the effects
    after the parent is gone and writes its records plus a report file
    (delegation-record/1, channel child, carrier env) that the runner collects
    after the window. Everything else is byte-identical in shape to
    baseline-t0 v2.
  window:
    start: mark-start
    end: mark-end

actions:
  # --- stdio_tool_call (MCP over stdio) — parent-performed ---
  - id: a001
    class: stdio_tool_call
    target: mcp://fs@local
    op: write_file
    args: { path: /workspace/out/a.txt, data: "hello from mcp fs" }

  - id: a002
    class: stdio_tool_call
    target: mcp://fs@local
    op: read_file
    args: { path: /workspace/out/a.txt }

  - id: a003
    class: stdio_tool_call
    target: mcp://fs@local
    op: list_directory
    args: { path: /workspace/out }

  # --- http_tool_call — parent-performed ---
  - id: a011
    class: http_tool_call
    target: http://http-endpoint:8080
    op: POST
    args: { path: /hook, body: "tool-call payload" }

  - id: a012
    class: http_tool_call
    target: http://http-endpoint:8080
    op: GET
    args: { path: /health }

  - id: a013
    class: http_tool_call
    target: http://http-endpoint:8080
    op: PUT
    args: { path: /state, body: "k=v" }

  # a014: the checked-DENY case (same as baseline v2) — parent-performed.
  - id: a014
    class: http_tool_call
    target: http://http-endpoint:8080
    op: POST
    args: { path: /hook, body: "policy-deny case" }

  # --- direct_network — performed by the DETACHED child after the parent
  #     is gone (the replay row ends status: submitted) ---
  - id: a021
    class: direct_network
    target: net-peer:9000
    op: tcp_connect
    args: { payload: "direct tcp" }
    performed_by: detached-child

  - id: a022
    class: direct_network
    target: net-peer:9001
    op: udp_send
    args: { payload: "direct udp" }
    performed_by: detached-child

  # --- process_spawn — performed by the DETACHED child ---
  - id: a031
    class: process_spawn
    target: /bin/sh
    op: exec
    args: { cmd: "echo hi" }
    performed_by: detached-child

  - id: a032
    class: process_spawn
    target: /bin/echo
    op: exec
    args: { cmd: "spawned directly" }
    performed_by: detached-child

  # --- file_write — performed by the DETACHED child ---
  - id: a041
    class: file_write
    target: /workspace/out/b.txt
    op: write
    args: { data: "direct write" }
    performed_by: detached-child

  - id: a042
    class: file_write
    target: /workspace/out/c.log
    op: append
    args: { data: "appended line\n" }
    performed_by: detached-child

  # --- credential_access — parent-performed (see baseline-f2.yaml header) ---
  - id: a051
    class: credential_access
    target: file:///run/secrets/token
    op: read

  - id: a052
    class: credential_access
    target: file:///run/secrets/db_password
    op: read
