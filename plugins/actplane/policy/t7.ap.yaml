# T7 fixture policy (ActPlane DSL) — the design's enforcement_config,
# hash-pinned per run into the fixture fingerprint (DESIGN.md 10).
#
# Design intent, mirroring the T1/T3 allow-all philosophy (gateway/policy.yaml:
# "the inspected-class coverage number isolates the topology from policy
# content") at the kernel position, with the notify scope pinned to the
# WORKLOAD'S DECLARED ACTION SURFACE (the baseline trace's targets):
#
#   - NOTIFY over the mediated classes AT THE TRACE'S TARGET PATTERNS, so
#     the engine emits one record per declared action instance and the
#     coverage number measures MEDIATION of the declared surface (the
#     kernel still mediates everything in the seeded tree by construction;
#     events outside the declared surface are enforced but not recorded —
#     the fixture's observation scope, stated here):
#       process_spawn  a031/a032  (exec /bin/sh, /bin/echo)
#       file_write     a041/a042  (write/unlink under /workspace/out/)
#       direct_network a021/a022  (connect *:9000, *:9001 — numeric IPv4)
#       credential_access a051/a052 (open under /run/secrets/)
#   - KILL on the a032 spawn (exec /bin/echo): the kernel-deny arm — the T7
#     analogue of a014's checked-DENY role in T6 (an argument-level
#     constraint is NOT expressible at the kernel, so the deny boundary is
#     a kernel-observable feature: the spawned binary). Denying a SPAWN
#     kills only the short-lived child, so the replay survives; denying
#     the in-process secret reads would SIGKILL the trace executor itself
#     and abort the measurement run (observed live 2026-11-01: the libuv
#     worker carrying the replay died at a051). a032 becomes `prevented`
#     (deny record + verified kernel absence of the spawn's effect, C6).
#
# Scope: the engine is seeded to the harness container's SHIM process (the
# docker-exec'd harness processes are its children, not the container
# init's), so the watch covers the measured agent container's full
# host-side tree — never the targets, the sensor, or unrelated hosts.
#
# Requires config-at-load (probe 2026-10-31: write-sink rules cannot be
# installed as runtime deltas) — the control service compiles this policy
# and loads the engine with it (plugins/actplane/entrypoint/t7-entrypoint.sh).
version: 1
policy: |
  source AGENT = exec "**"

  rule t7-notify-sh:
    notify exec "/bin/sh" if AGENT
    because "T7 coverage: a031 (exec /bin/sh) — mediation of the declared spawn surface"

  rule t7-notify-echo:
    notify exec "/bin/echo" if AGENT
    because "T7 coverage: a032 (exec /bin/echo) — the denied twin records the checked evaluation"

  rule t7-kill-echo:
    kill exec "/bin/echo" if AGENT
    because "T7 prevention arm: the a032 spawn is denied at the kernel (deny + verified absence = prevented, C6); kills only the short-lived child, so the replay survives"

  rule t7-notify-secret-open:
    notify open file "/run/secrets/**" if AGENT
    because "T7 coverage: the secret reads are checked at the kernel (a051/a052)"

  rule t7-notify-write:
    notify write file "/workspace/out/**" if AGENT
    because "T7 coverage: a041/a042 — mediation of the declared write surface"

  rule t7-notify-unlink:
    notify unlink file "/workspace/out/**" if AGENT
    because "T7 coverage: unlink mediation on the declared surface"

  rule t7-notify-connect-9000:
    notify connect endpoint "*:9000" if AGENT
    because "T7 coverage: a021 (tcp_connect net-peer:9000)"

  rule t7-notify-connect-9001:
    notify connect endpoint "*:9001" if AGENT
    because "T7 coverage: a022 (udp_send net-peer:9001)"
