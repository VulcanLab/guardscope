# plugins/agt-gateway/overlay/t2.yaml — the agt-gateway control binding for
# design T2 (DESIGN.md 7): the gateway slot's service definition, moved
# verbatim out of compose/t2.yaml (the base). T2 is T1 plus the silent
# forced-egress jail, which stays in the base: the jail is environment
# topology, never part of the control.
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t2.yaml -f plugins/agt-gateway/overlay/t2.yaml up -d
#   docker compose -f compose/t2.yaml -f plugins/agt-gateway/overlay/t2.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit (its harness and egress-jail
# services depend on the slot's gateway service). Slot declaration:
# compose/slots/t2.yaml. Deployed policy: gateway/policy.yaml (T1's
# allow-all default; the enforcement_config component of the fixture
# fingerprint, DESIGN.md 10).

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t2-gateway
    networks: [t2net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t2-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http]
    restart: unless-stopped
