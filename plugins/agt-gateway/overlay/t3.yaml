# plugins/agt-gateway/overlay/t3.yaml — the agt-gateway control binding for
# design T3 (DESIGN.md 7): the gateway slot's service definition, moved
# verbatim out of compose/t3.yaml (the base). T3 routes BOTH tool classes
# behind the gateway (UPSTREAM_FS_URL -> mcp-fs-http; the stdio transport
# is eliminated at the harness), and deploys the T3 policy
# (gateway/policy-t3.yaml, baked into the image at the GATEWAY_POLICY path;
# the enforcement_config component of the fixture fingerprint, DESIGN.md
# 10). The forced-egress jail stays in the base: the jail is environment
# topology, never part of the control.
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t3.yaml -f plugins/agt-gateway/overlay/t3.yaml up -d
#   docker compose -f compose/t3.yaml -f plugins/agt-gateway/overlay/t3.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit (its harness and egress-jail
# services depend on the slot's gateway service). Slot declaration:
# compose/slots/t3.yaml.

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t3-gateway
    networks: [t3net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      UPSTREAM_FS_URL: http://mcp-fs-http:8092/mcp    # T3: fs tools behind the gateway
      GATEWAY_POLICY: /opt/inspection/gateway/policy-t3.yaml
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t3-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http, mcp-fs-http]
    restart: unless-stopped
