# plugins/agt-gateway/overlay/t1.yaml — the agt-gateway control binding for
# design T1 (DESIGN.md 7): the service definition of the gateway slot, moved
# verbatim out of compose/t1.yaml (the base) into the control's binding
# bundle. Every fixture with a control slot is a placeholder base + a
# control-binding overlay; this shipped binding is expressed exactly like a
# third party's, nothing is special-cased for it.
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t1.yaml -f plugins/agt-gateway/overlay/t1.yaml up -d
#   docker compose -f compose/t1.yaml -f plugins/agt-gateway/overlay/t1.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit: its harness services depend on
# the slot's gateway service and `docker compose -f compose/t1.yaml config`
# fails loudly without this overlay. The slot declaration lives in
# compose/slots/t1.yaml (framework-side sidecar data, read by the overlay
# validator; compose rejects unknown top-level keys, so the base stays pure
# compose). The deployed policy this binding ships is gateway/policy.yaml
# (the design's default; the enforcement_config component of the fixture
# fingerprint, DESIGN.md 10).

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t1-gateway
    networks: [t1net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t1-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http]
    restart: unless-stopped
