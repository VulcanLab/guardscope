# plugins/agt-gateway/overlay/t3-mock.yaml — the agt-gateway control binding
# for design T3 on the mock-harness fixture (DESIGN.md 7, 8): the gateway
# slot's service definition, moved verbatim out of compose/t3-mock.yaml (the
# base). Same binding as overlay/t3.yaml (both tool classes behind the
# gateway, the T3 policy gateway/policy-t3.yaml baked into the image);
# only the mock fixture's container prefix and agent id differ. The
# forced-egress jail stays in the base (environment topology, never part
# of the control).
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t3-mock.yaml -f plugins/agt-gateway/overlay/t3-mock.yaml up -d
#   docker compose -f compose/t3-mock.yaml -f plugins/agt-gateway/overlay/t3-mock.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit (the mock-harness and
# egress-jail services depend on the slot's gateway service). Slot
# declaration: compose/slots/t3.yaml.

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t3-mock-gateway
    networks: [t3net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      UPSTREAM_FS_URL: http://mcp-fs-http:8092/mcp    # T3: fs tools behind the gateway
      GATEWAY_POLICY: /opt/inspection/gateway/policy-t3.yaml
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t3-mock-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http, mcp-fs-http]
    restart: unless-stopped
