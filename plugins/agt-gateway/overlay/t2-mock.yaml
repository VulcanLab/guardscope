# plugins/agt-gateway/overlay/t2-mock.yaml — the agt-gateway control binding
# for design T2 on the mock-harness fixture (DESIGN.md 7, 8): the gateway
# slot's service definition, moved verbatim out of compose/t2-mock.yaml (the
# base). Same binding as overlay/t2.yaml; only the mock fixture's container
# prefix and agent id differ. The forced-egress jail stays in the base (the
# jail is environment topology, never part of the control).
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t2-mock.yaml -f plugins/agt-gateway/overlay/t2-mock.yaml up -d
#   docker compose -f compose/t2-mock.yaml -f plugins/agt-gateway/overlay/t2-mock.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit (the mock-harness and
# egress-jail services depend on the slot's gateway service). Slot
# declaration: compose/slots/t2.yaml.

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t2-mock-gateway
    networks: [t2net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t2-mock-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http]
    restart: unless-stopped
