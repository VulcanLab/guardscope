# plugins/agt-gateway/overlay/t1-mock.yaml — the agt-gateway control binding
# for design T1 on the mock-harness fixture (DESIGN.md 7, 8): the gateway
# slot's service definition, moved verbatim out of compose/t1-mock.yaml (the
# base). Same binding as overlay/t1.yaml; only the mock fixture's container
# prefix and agent id differ.
#
# Merged bring-up (the base comes FIRST — the relative build context below
# resolves against the FIRST compose file's directory, so the base must
# precede this overlay):
#   docker compose -f compose/t1-mock.yaml -f plugins/agt-gateway/overlay/t1-mock.yaml up -d
#   docker compose -f compose/t1-mock.yaml -f plugins/agt-gateway/overlay/t1-mock.yaml --profile sensor up -d tracee
#
# The base alone is not a validatable unit (the mock-harness service
# depends on the slot's gateway service). Slot declaration:
# compose/slots/t1.yaml (the slot is per design; the mock fixture realizes
# the same slot on its own compose project).

services:
  gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    image: inspection/gateway
    container_name: t1-mock-gateway
    networks: [t1net]
    environment:
      UPSTREAM_URL: http://mcp-http:8091/mcp
      GATEWAY_LOG_DIR: /var/log/gateway
      GATEWAY_AGENT_ID: t1-mock-replay
    volumes:
      - gateway-logs:/var/log/gateway
    depends_on: [mcp-http]
    restart: unless-stopped
