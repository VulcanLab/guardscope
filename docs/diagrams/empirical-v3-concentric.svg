<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="660" viewBox="0 0 1000 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33414E"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009ADE"/></marker>
    <marker id="ahP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AF58BA"/></marker>
    <marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6B76"/></marker>
    <path id="ctrlLabel" d="M 377.8,170.5 A 140,140 0 0 1 489,211"/>
  </defs>

  <rect x="0" y="0" width="1000" height="660" fill="#ffffff"/>

  <!-- kernel ring -->
  <circle cx="390" cy="310" r="235" fill="#A0B1BA" fill-opacity="0.07"/>
  <circle cx="390" cy="310" r="235" fill="none" stroke="#A0B1BA" stroke-width="13"/>
  <text x="390" y="575" text-anchor="middle" font-size="16" font-weight="700" fill="#5D6B76">Host kernel · eBPF sensor</text>

  <!-- runtime control: partial arc -->
  <path d="M 375.9,148.6 A 162,162 0 0 1 504.5,195.5 L 473.4,226.6 A 118,118 0 0 0 379.7,192.5 Z" fill="#AF58BA" fill-opacity="0.28" stroke="#AF58BA" stroke-width="2.5"/>
  <text font-size="13.5" font-weight="700" fill="#7B3B87">
    <textPath href="#ctrlLabel" startOffset="50%" text-anchor="middle">Runtime control</textPath>
  </text>

  <!-- harness -->
  <circle cx="390" cy="310" r="78" fill="#009ADE" fill-opacity="0.15" stroke="#009ADE" stroke-width="2.5"/>
  <text x="390" y="316" text-anchor="middle" font-size="16.5" font-weight="700" fill="#22303C">Agent harness</text>

  <!-- workload -->
  <rect x="30" y="282" width="120" height="56" rx="8" fill="#F28522" fill-opacity="0.16" stroke="#F28522" stroke-width="2"/>
  <text x="90" y="315" text-anchor="middle" font-size="14.5" font-weight="600" fill="#22303C">Fixed workload</text>
  <line x1="152" y1="310" x2="304" y2="310" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- action paths: harness to kernel ring -->
  <line x1="306.9" y1="287.7" x2="162" y2="248.9" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="340.6" y1="239.6" x2="254.6" y2="116.7" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="375" y1="225.3" x2="349" y2="77.6" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="419.4" y1="229.2" x2="470.7" y2="88.2" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="460.4" y1="260.6" x2="583.3" y2="174.6" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="475.7" y1="302.5" x2="625.1" y2="289.5" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- family labels -->
  <text x="137" y="242" text-anchor="middle" font-size="13" fill="#33414E">in-process</text>
  <text x="239.6" y="95.4" text-anchor="middle" font-size="13" fill="#33414E">subprocess</text>
  <text x="344.4" y="52" text-anchor="middle" font-size="13" fill="#33414E">net egress</text>
  <text x="479.6" y="63.9" text-anchor="middle" font-size="13" fill="#33414E">tool-server</text>
  <text x="604.6" y="159.6" text-anchor="middle" font-size="13" fill="#33414E">delegation</text>
  <text x="650.9" y="287.2" text-anchor="middle" font-size="13" fill="#33414E">deferred</text>

  <!-- reconciler -->
  <rect x="720" y="300" width="240" height="60" rx="8" fill="#FFC61E" fill-opacity="0.20" stroke="#FFC61E" stroke-width="2.5"/>
  <text x="840" y="336" text-anchor="middle" font-size="16.5" font-weight="700" fill="#22303C">Reconciler</text>

  <!-- coverage grid -->
  <rect x="720" y="420" width="240" height="215" rx="8" fill="#ffffff" stroke="#5D6B76" stroke-width="1.5"/>
  <text x="840" y="446" text-anchor="middle" font-size="14" font-weight="700" fill="#22303C">Coverage grid</text>
  <rect x="753" y="458" width="54" height="22" fill="#FF1F5B"/>
  <rect x="813" y="458" width="54" height="22" fill="#FF1F5B"/>
  <rect x="873" y="458" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="485" width="54" height="22" fill="#FF1F5B"/>
  <rect x="813" y="485" width="54" height="22" fill="#FF1F5B"/>
  <rect x="873" y="485" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="512" width="54" height="22" fill="#FF1F5B"/>
  <rect x="813" y="512" width="54" height="22" fill="#009ADE"/>
  <rect x="873" y="512" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="539" width="54" height="22" fill="#00CD6C"/>
  <rect x="813" y="539" width="54" height="22" fill="#00CD6C"/>
  <rect x="873" y="539" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="566" width="54" height="22" fill="#FF1F5B"/>
  <rect x="813" y="566" width="54" height="22" fill="#FF1F5B"/>
  <rect x="873" y="566" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="593" width="54" height="22" fill="#FF1F5B"/>
  <rect x="813" y="593" width="54" height="22" fill="#009ADE"/>
  <rect x="873" y="593" width="54" height="22" fill="#00CD6C"/>
  <rect x="753" y="622" width="10" height="10" fill="#00CD6C"/>
  <text x="767" y="631" font-size="11.5" fill="#33414E">checked</text>
  <rect x="830" y="622" width="10" height="10" fill="#FF1F5B"/>
  <text x="844" y="631" font-size="11.5" fill="#33414E">bypassed</text>
  <rect x="912" y="622" width="10" height="10" fill="#009ADE"/>
  <text x="926" y="631" font-size="11.5" fill="#33414E">prevented</text>

  <!-- records (claims, dashed) -->
  <path d="M460.3,359.3 C 560,400 660,390 712,340" fill="none" stroke="#009ADE" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahB)"/>
  <path d="M504.5,195.5 C 640,200 780,250 838,294" fill="none" stroke="#AF58BA" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahP)"/>

  <!-- kernel events (truth, solid) -->
  <path d="M593.5,427.5 C 650,445 750,415 794,364" fill="none" stroke="#5D6B76" stroke-width="2.5" marker-end="url(#ahK)"/>

  <line x1="840" y1="364" x2="840" y2="414" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- line-style legend -->
  <line x1="30" y1="632" x2="74" y2="632" stroke="#5D6B76" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="82" y="636" font-size="12.5" fill="#33414E">self-reported records</text>
  <line x1="240" y1="632" x2="284" y2="632" stroke="#5D6B76" stroke-width="2"/>
  <text x="292" y="636" font-size="12.5" fill="#33414E">kernel-observed events</text>
</svg>
