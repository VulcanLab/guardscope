<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="660" viewBox="0 0 1040 660" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33414E"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009ADE"/></marker>
    <marker id="ahP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AF58BA"/></marker>
    <marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6B76"/></marker>
  </defs>

  <rect x="0" y="0" width="1040" height="660" fill="#ffffff"/>

  <!-- workload -->
  <rect x="40" y="180" width="130" height="52" rx="8" fill="#F28522" fill-opacity="0.16" stroke="#F28522" stroke-width="2"/>
  <text x="105" y="212" text-anchor="middle" font-size="15" font-weight="600" fill="#22303C">Fixed workload</text>
  <line x1="172" y1="206" x2="216" y2="206" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- harness -->
  <rect x="220" y="150" width="180" height="120" rx="10" fill="#009ADE" fill-opacity="0.14" stroke="#009ADE" stroke-width="2.5"/>
  <text x="310" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#22303C">Agent harness</text>

  <!-- runtime control -->
  <rect x="620" y="150" width="64" height="120" rx="8" fill="#AF58BA" fill-opacity="0.16" stroke="#AF58BA" stroke-width="2.5"/>
  <text x="652" y="215" text-anchor="middle" font-size="14" font-weight="700" fill="#22303C" transform="rotate(-90 652 210)">Runtime control</text>

  <!-- kernel -->
  <rect x="880" y="70" width="110" height="340" rx="10" fill="#A0B1BA" fill-opacity="0.16" stroke="#A0B1BA" stroke-width="2.5"/>
  <text x="935" y="230" text-anchor="middle" font-size="15.5" font-weight="700" fill="#22303C">Host kernel</text>
  <text x="935" y="252" text-anchor="middle" font-size="12.5" fill="#5D6B76">eBPF sensor</text>

  <!-- action paths: harness to kernel -->
  <path d="M400,165 C 560,150 760,80 876,100" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M400,187 C 550,168 780,105 876,130" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M400,209 L 876,250" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M400,231 C 540,265 760,300 876,305" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M400,253 C 540,290 760,330 876,350" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M400,275 C 550,300 760,370 876,385" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- family labels -->
  <text x="866" y="88" text-anchor="end" font-size="13" fill="#33414E">in-process</text>
  <text x="866" y="124" text-anchor="end" font-size="13" fill="#33414E">subprocess</text>
  <text x="866" y="238" text-anchor="end" font-size="13" fill="#33414E">tool-server</text>
  <text x="866" y="294" text-anchor="end" font-size="13" fill="#33414E">net egress</text>
  <text x="866" y="338" text-anchor="end" font-size="13" fill="#33414E">delegation</text>
  <text x="866" y="373" text-anchor="end" font-size="13" fill="#33414E">deferred</text>

  <!-- reconciler -->
  <rect x="430" y="440" width="220" height="56" rx="8" fill="#FFC61E" fill-opacity="0.20" stroke="#FFC61E" stroke-width="2.5"/>
  <text x="540" y="474" text-anchor="middle" font-size="16.5" font-weight="700" fill="#22303C">Reconciler</text>

  <!-- coverage grid -->
  <rect x="40" y="430" width="240" height="225" rx="8" fill="#ffffff" stroke="#5D6B76" stroke-width="1.5"/>
  <text x="160" y="456" text-anchor="middle" font-size="14" font-weight="700" fill="#22303C">Coverage grid</text>
  <rect x="73" y="468" width="54" height="22" fill="#FF1F5B"/>
  <rect x="133" y="468" width="54" height="22" fill="#FF1F5B"/>
  <rect x="193" y="468" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="495" width="54" height="22" fill="#FF1F5B"/>
  <rect x="133" y="495" width="54" height="22" fill="#FF1F5B"/>
  <rect x="193" y="495" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="522" width="54" height="22" fill="#FF1F5B"/>
  <rect x="133" y="522" width="54" height="22" fill="#009ADE"/>
  <rect x="193" y="522" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="549" width="54" height="22" fill="#00CD6C"/>
  <rect x="133" y="549" width="54" height="22" fill="#00CD6C"/>
  <rect x="193" y="549" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="576" width="54" height="22" fill="#FF1F5B"/>
  <rect x="133" y="576" width="54" height="22" fill="#FF1F5B"/>
  <rect x="193" y="576" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="603" width="54" height="22" fill="#FF1F5B"/>
  <rect x="133" y="603" width="54" height="22" fill="#009ADE"/>
  <rect x="193" y="603" width="54" height="22" fill="#00CD6C"/>
  <rect x="73" y="632" width="10" height="10" fill="#00CD6C"/>
  <text x="87" y="641" font-size="11.5" fill="#33414E">checked</text>
  <rect x="150" y="632" width="10" height="10" fill="#FF1F5B"/>
  <text x="164" y="641" font-size="11.5" fill="#33414E">bypassed</text>
  <rect x="228" y="632" width="10" height="10" fill="#009ADE"/>
  <text x="242" y="641" font-size="11.5" fill="#33414E">prevented</text>

  <!-- records (claims, dashed) -->
  <path d="M310,274 C 320,340 400,405 448,436" fill="none" stroke="#009ADE" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahB)"/>
  <path d="M652,274 C 650,330 645,390 628,434" fill="none" stroke="#AF58BA" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahP)"/>

  <!-- kernel events (truth, solid) -->
  <path d="M935,414 C 940,468 800,468 658,468" fill="none" stroke="#5D6B76" stroke-width="2.5" marker-end="url(#ahK)"/>

  <line x1="426" y1="468" x2="286" y2="468" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- line-style legend -->
  <line x1="700" y1="626" x2="744" y2="626" stroke="#5D6B76" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="752" y="630" font-size="12.5" fill="#33414E">self-reported records</text>
  <line x1="700" y1="648" x2="744" y2="648" stroke="#5D6B76" stroke-width="2"/>
  <text x="752" y="652" font-size="12.5" fill="#33414E">kernel-observed events</text>
</svg>
