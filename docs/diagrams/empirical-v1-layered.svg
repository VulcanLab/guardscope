<svg xmlns="http://www.w3.org/2000/svg" width="980" height="680" viewBox="0 0 980 680" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33414E"/></marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#009ADE"/></marker>
    <marker id="ahP" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#AF58BA"/></marker>
    <marker id="ahK" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5D6B76"/></marker>
  </defs>

  <rect x="0" y="0" width="980" height="680" fill="#ffffff"/>

  <!-- workload -->
  <rect x="48" y="64" width="150" height="52" rx="8" fill="#F28522" fill-opacity="0.16" stroke="#F28522" stroke-width="2"/>
  <text x="123" y="96" text-anchor="middle" font-size="15" font-weight="600" fill="#22303C">Fixed workload</text>
  <line x1="198" y1="90" x2="252" y2="90" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- harness -->
  <rect x="256" y="60" width="320" height="88" rx="10" fill="#009ADE" fill-opacity="0.14" stroke="#009ADE" stroke-width="2.5"/>
  <text x="416" y="106" text-anchor="middle" font-size="17" font-weight="700" fill="#22303C">Agent harness</text>

  <!-- runtime control -->
  <rect x="330" y="300" width="140" height="58" rx="8" fill="#AF58BA" fill-opacity="0.16" stroke="#AF58BA" stroke-width="2.5"/>
  <text x="400" y="335" text-anchor="middle" font-size="14.5" font-weight="700" fill="#22303C">Runtime control</text>

  <!-- kernel -->
  <rect x="48" y="520" width="528" height="96" rx="10" fill="#A0B1BA" fill-opacity="0.16" stroke="#A0B1BA" stroke-width="2.5"/>
  <text x="128" y="548" text-anchor="middle" font-size="13" fill="#33414E">in-process</text>
  <text x="216" y="548" text-anchor="middle" font-size="13" fill="#33414E">subprocess</text>
  <text x="280" y="548" text-anchor="middle" font-size="13" fill="#33414E">net egress</text>
  <text x="392" y="548" text-anchor="middle" font-size="13" fill="#33414E">tool-server</text>
  <text x="480" y="548" text-anchor="middle" font-size="13" fill="#33414E">delegation</text>
  <text x="568" y="548" text-anchor="middle" font-size="13" fill="#33414E">deferred</text>
  <text x="312" y="582" text-anchor="middle" font-size="16.5" font-weight="700" fill="#22303C">Host kernel</text>
  <text x="312" y="602" text-anchor="middle" font-size="12.5" fill="#5D6B76">eBPF sensor · ground truth</text>

  <!-- action paths: harness to kernel -->
  <path d="M296,148 C 250,300 160,420 128,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M336,148 C 300,290 240,420 216,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M376,148 C 340,250 285,390 280,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M416,148 L 392,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M456,148 C 500,260 490,400 480,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>
  <path d="M496,148 C 540,300 570,420 568,512" fill="none" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- reconciler -->
  <rect x="648" y="280" width="240" height="60" rx="8" fill="#FFC61E" fill-opacity="0.20" stroke="#FFC61E" stroke-width="2.5"/>
  <text x="768" y="316" text-anchor="middle" font-size="16.5" font-weight="700" fill="#22303C">Reconciler</text>

  <!-- coverage grid -->
  <rect x="648" y="400" width="240" height="250" rx="8" fill="#ffffff" stroke="#5D6B76" stroke-width="1.5"/>
  <text x="768" y="428" text-anchor="middle" font-size="14" font-weight="700" fill="#22303C">Coverage grid</text>
  <rect x="669" y="440" width="62" height="24" fill="#FF1F5B"/>
  <rect x="737" y="440" width="62" height="24" fill="#FF1F5B"/>
  <rect x="805" y="440" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="470" width="62" height="24" fill="#FF1F5B"/>
  <rect x="737" y="470" width="62" height="24" fill="#FF1F5B"/>
  <rect x="805" y="470" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="500" width="62" height="24" fill="#FF1F5B"/>
  <rect x="737" y="500" width="62" height="24" fill="#009ADE"/>
  <rect x="805" y="500" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="530" width="62" height="24" fill="#00CD6C"/>
  <rect x="737" y="530" width="62" height="24" fill="#00CD6C"/>
  <rect x="805" y="530" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="560" width="62" height="24" fill="#FF1F5B"/>
  <rect x="737" y="560" width="62" height="24" fill="#FF1F5B"/>
  <rect x="805" y="560" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="590" width="62" height="24" fill="#FF1F5B"/>
  <rect x="737" y="590" width="62" height="24" fill="#009ADE"/>
  <rect x="805" y="590" width="62" height="24" fill="#00CD6C"/>
  <rect x="669" y="630" width="10" height="10" fill="#00CD6C"/>
  <text x="683" y="639" font-size="11.5" fill="#33414E">checked</text>
  <rect x="746" y="630" width="10" height="10" fill="#FF1F5B"/>
  <text x="760" y="639" font-size="11.5" fill="#33414E">bypassed</text>
  <rect x="830" y="630" width="10" height="10" fill="#009ADE"/>
  <text x="844" y="639" font-size="11.5" fill="#33414E">prevented</text>

  <!-- records (claims, dashed) -->
  <path d="M576,104 C 660,140 690,210 700,274" fill="none" stroke="#009ADE" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahB)"/>
  <path d="M470,329 C 540,320 600,305 642,302" fill="none" stroke="#AF58BA" stroke-width="2" stroke-dasharray="7,5" marker-end="url(#ahP)"/>

  <!-- kernel events (truth, solid) -->
  <path d="M576,562 C 600,540 600,440 690,346" fill="none" stroke="#5D6B76" stroke-width="2.5" marker-end="url(#ahK)"/>

  <line x1="768" y1="344" x2="768" y2="394" stroke="#33414E" stroke-width="2" marker-end="url(#ah)"/>

  <!-- line-style legend -->
  <line x1="48" y1="650" x2="92" y2="650" stroke="#5D6B76" stroke-width="2" stroke-dasharray="7,5"/>
  <text x="100" y="654" font-size="12.5" fill="#33414E">self-reported records</text>
  <line x1="260" y1="650" x2="304" y2="650" stroke="#5D6B76" stroke-width="2"/>
  <text x="312" y="654" font-size="12.5" fill="#33414E">kernel-observed events</text>
</svg>
